name: Android CI & Verifiable Release

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Branches and pull requests: unit tests, debug APK and guards. Never publishes.
  build-and-verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug

      - name: Verify debug APK manifest
        run: scripts/check-manifest.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Test manifest guard
        run: scripts/test-check-manifest.sh

      - name: Test GeoNames city builder
        run: python3 -IB -m unittest discover -s tools/geonames -p 'test_*.py'

  # Tag v*: test, build signed release APK, verify, attest and publish to GitHub Releases.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Test manifest guard
        run: scripts/test-check-manifest.sh

      - name: Test GeoNames city builder
        run: python3 -IB -m unittest discover -s tools/geonames -p 'test_*.py'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CENIT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CENIT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CENIT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CENIT_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing CENIT_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing CENIT_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing CENIT_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing CENIT_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Refusing to publish an unsigned APK. See RELEASING.md."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "Keystore decoded to \$RUNNER_TEMP/release.jks"

      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || printf '%s' "$VERSION" | grep -q '[^0-9A-Za-z._-]'; then
            echo "::error::Invalid version tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION (versionCode $GITHUB_RUN_NUMBER)"

      - name: Assemble signed release APK
        env:
          ORG_GRADLE_PROJECT_cenitReleaseStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_cenitReleaseStorePassword: ${{ secrets.CENIT_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_cenitReleaseKeyAlias: ${{ secrets.CENIT_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_cenitReleaseKeyPassword: ${{ secrets.CENIT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease "-PversionName=$VERSION" "-PversionCode=$GITHUB_RUN_NUMBER"

      - name: Verify manifest, signature, rename and checksum
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Signed APK not found (unsigned build?). Refusing to publish."
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          scripts/check-manifest.sh "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | grep -v -- "-rc" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/cenit-$VERSION.apk"
          (cd dist && sha256sum "cenit-$VERSION.apk" > "cenit-$VERSION.apk.sha256" && cat "cenit-$VERSION.apk.sha256")

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/cenit-${{ env.VERSION }}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/cenit-$VERSION.apk" \
            "dist/cenit-$VERSION.apk.sha256" \
            --title "Cenit $VERSION" \
            --verify-tag \
            --generate-notes

      - name: Delete decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
